name: drt-ops-pilot

services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DRT_OPS_DATABASE:-drt_ops}
      POSTGRES_USER: ${DRT_OPS_DATASOURCE_USERNAME:-drt_ops}
      POSTGRES_PASSWORD: ${DRT_OPS_DATASOURCE_PASSWORD:-drt_ops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  algorithm:
    build:
      context: ../apps/algorithm
    restart: unless-stopped
    ports:
      - "8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  route-simulator:
    build:
      context: ../apps/route-simulator
    restart: unless-stopped
    ports:
      - "8091:8091"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DRT_OPS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DRT_OPS_DATABASE:-drt_ops}
      DRT_OPS_DATASOURCE_USERNAME: ${DRT_OPS_DATASOURCE_USERNAME:-drt_ops}
      DRT_OPS_DATASOURCE_PASSWORD: ${DRT_OPS_DATASOURCE_PASSWORD:-drt_ops}
      DISPATCH_ALGORITHM_BASE_URL: http://algorithm:8090
      DRT_AMAP_ENABLED: "true"
      DRT_AMAP_WEB_SERVICE_KEY: local-simulator
      DRT_AMAP_BASE_URL: http://route-simulator:8091
      DRT_AUTH_JWT_SECRET: ${DRT_AUTH_JWT_SECRET:-pilot-only-jwt-secret-change-before-production}
      DRT_AUTH_BOOTSTRAP_ADMIN_USERNAME: ${DRT_AUTH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      DRT_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${DRT_AUTH_BOOTSTRAP_ADMIN_PASSWORD:-pilot-only-password}
      DRT_AUTH_REFRESH_COOKIE_SECURE: ${DRT_AUTH_REFRESH_COOKIE_SECURE:-false}
      DRT_WEB_ALLOWED_ORIGINS: ${DRT_WEB_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5176,http://127.0.0.1:5176}
      JT_GATEWAY_SERVICE_CREDENTIALS_CURRENT_VERSION: ${JT_GATEWAY_SERVICE_CREDENTIAL_VERSION:?JT_GATEWAY_SERVICE_CREDENTIAL_VERSION must be set}
      JT_GATEWAY_SERVICE_CREDENTIALS_CURRENT_HASH: ${JT_GATEWAY_SERVICE_CREDENTIAL_SHA256:?JT_GATEWAY_SERVICE_CREDENTIAL_SHA256 must be set}
      JT_GATEWAY_SERVICE_CREDENTIALS_PREVIOUS_VERSION: ${JT_GATEWAY_PREVIOUS_SERVICE_CREDENTIAL_VERSION:-}
      JT_GATEWAY_SERVICE_CREDENTIALS_PREVIOUS_HASH: ${JT_GATEWAY_PREVIOUS_SERVICE_CREDENTIAL_SHA256:-}
    depends_on:
      postgres:
        condition: service_healthy
      algorithm:
        condition: service_healthy
      route-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  jt-gateway:
    build:
      context: ..
      dockerfile: apps/jt-gateway/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${JT_GATEWAY_TCP_PORT:-7611}:7611"
    expose:
      - "7612"
    environment:
      JT_GATEWAY_TCP_ENABLED: "true"
      JT_GATEWAY_TCP_PORT: "7611"
      JT_GATEWAY_MANAGEMENT_PORT: "7612"
      JT_GATEWAY_DATASOURCE_URL: jdbc:h2:file:/var/lib/jt-gateway/gateway-outbox;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
      JT_GATEWAY_OPERATIONS_API_BASE_URL: ${JT_GATEWAY_OPERATIONS_API_BASE_URL:?JT_GATEWAY_OPERATIONS_API_BASE_URL must be set}
      JT_GATEWAY_SERVICE_CREDENTIAL_VERSION: ${JT_GATEWAY_SERVICE_CREDENTIAL_VERSION:?JT_GATEWAY_SERVICE_CREDENTIAL_VERSION must be set}
      JT_GATEWAY_SERVICE_CREDENTIAL_PLAINTEXT: ${JT_GATEWAY_SERVICE_CREDENTIAL_PLAINTEXT:?JT_GATEWAY_SERVICE_CREDENTIAL_PLAINTEXT must be set}
      JT_GATEWAY_INSTANCE: ${JT_GATEWAY_INSTANCE:?JT_GATEWAY_INSTANCE must be set}
    volumes:
      - jt-gateway-data:/var/lib/jt-gateway
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7612/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin-web:
    build:
      context: ../apps/admin-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  jt-gateway-data:
